name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32
            arch: x64
            server_bin: yahoo-search-mcp.exe
            launcher_bin: yahoo-search-mcp-launcher.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64
            server_bin: yahoo-search-mcp
            launcher_bin: yahoo-search-mcp-launcher
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
            server_bin: yahoo-search-mcp
            launcher_bin: yahoo-search-mcp-launcher

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package installer and MCPB
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          BUNDLE="Yahoo-Japan-Search-MCP-${TAG}-${{ matrix.platform }}-${{ matrix.arch }}"
          RELEASE_DIR="target/${{ matrix.target }}/release"

          # sha256sum is absent on macOS runners.
          if command -v sha256sum >/dev/null 2>&1; then
            SHA="sha256sum"
          else
            SHA="shasum -a 256"
          fi

          mkdir -p dist

          # ── Installer package (server + launcher) ──
          INSTALLER_DIR="dist/${BUNDLE}"
          mkdir -p "${INSTALLER_DIR}"
          cp "${RELEASE_DIR}/${{ matrix.server_bin }}" "${INSTALLER_DIR}/"
          cp "${RELEASE_DIR}/${{ matrix.launcher_bin }}" "${INSTALLER_DIR}/"
          cp README.md README.en.md LICENSE "${INSTALLER_DIR}/"

          cd dist
          if [[ "${{ matrix.platform }}" == "win32" ]]; then
            7z a -tzip "${BUNDLE}.zip" "${BUNDLE}/"
          else
            zip -r9 "${BUNDLE}.zip" "${BUNDLE}/"
          fi
          cd ..

          # ── MCPB bundle (server only, for the MCP Registry) ──
          MCPB_NAME="yahoo-search-mcp-${TAG}-${{ matrix.platform }}-${{ matrix.arch }}"
          MCPB_STAGE="dist/${MCPB_NAME}-stage"
          mkdir -p "${MCPB_STAGE}/server"
          cp "${RELEASE_DIR}/${{ matrix.server_bin }}" "${MCPB_STAGE}/server/"

          sed -e "s/\"version\": \"0.1.0\"/\"version\": \"${VERSION}\"/" \
              -e "s|\"entry_point\": \"server/yahoo-search-mcp\"|\"entry_point\": \"server/${{ matrix.server_bin }}\"|" \
              -e "s|\"command\": \"server/yahoo-search-mcp\"|\"command\": \"server/${{ matrix.server_bin }}\"|" \
              manifest.json > "${MCPB_STAGE}/manifest.json"

          cd "${MCPB_STAGE}"
          if [[ "${{ matrix.platform }}" == "win32" ]]; then
            7z a -tzip "../${MCPB_NAME}.mcpb" .
          else
            zip -r9 "../${MCPB_NAME}.mcpb" .
          fi
          cd ../..

          # ── Wrap the MCPB in a zip for stores that reject unknown extensions ──
          cd dist
          if [[ "${{ matrix.platform }}" == "win32" ]]; then
            7z a -tzip "${MCPB_NAME}.mcpb.zip" "${MCPB_NAME}.mcpb"
          else
            zip -9 "${MCPB_NAME}.mcpb.zip" "${MCPB_NAME}.mcpb"
          fi

          # ── Checksums ──
          ${SHA} "${BUNDLE}.zip" "${MCPB_NAME}.mcpb" "${MCPB_NAME}.mcpb.zip" \
            > "checksums-${{ matrix.platform }}.txt"
          cat "checksums-${{ matrix.platform }}.txt"
          cd ..

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Yahoo! JAPAN Search MCP ${{ github.ref_name }}

            APIキー不要・設定不要。ダウンロードして起動するだけで使えます。
            No API key, no login, no configuration — download and run.

            ### Install

            1. Download the ZIP for your platform and extract it
            2. Run the launcher (`yahoo-search-mcp-launcher`) and click Install for your agent
            3. Or run `yahoo-search-mcp setup` in a terminal for copy-paste config

            | Platform | Installer | MCPB (MCP Registry) |
            |----------|-----------|---------------------|
            | Windows x64 | `Yahoo-Japan-Search-MCP-${{ github.ref_name }}-win32-x64.zip` | `yahoo-search-mcp-${{ github.ref_name }}-win32-x64.mcpb` |
            | macOS ARM64 | `Yahoo-Japan-Search-MCP-${{ github.ref_name }}-macos-arm64.zip` | `yahoo-search-mcp-${{ github.ref_name }}-macos-arm64.mcpb` |
            | Linux x64 | `Yahoo-Japan-Search-MCP-${{ github.ref_name }}-linux-x64.zip` | `yahoo-search-mcp-${{ github.ref_name }}-linux-x64.mcpb` |
          files: |
            dist/*.zip
            dist/*.mcpb
            dist/*.mcpb.zip
            dist/checksums-*.txt
